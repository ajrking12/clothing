<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Clothing</title>
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">

  <!-- Header -->
  <header class="bg-slate-950 text-white p-4 sticky top-0 flex justify-between items-center shadow">
    <div>
      <h1 class="font-bold text-lg text-amber-400 uppercase">AR Clothing</h1>
      <p class="text-xs text-slate-300">Premium Styles • Everyday Prices</p>
    </div>
    <a id="wa-top" href="#" target="_blank" class="bg-emerald-600 text-white text-xs font-bold px-3 py-2 rounded-full">WhatsApp</a>
  </header>

  <!-- Hero -->
  <section class="bg-slate-900 text-white text-center py-10 px-4">
    <h2 class="text-2xl font-extrabold mb-2">New AR Clothing Collection</h2>
    <p class="text-sm text-slate-300 mb-4">Tap any item below to order directly on WhatsApp.</p>
    <a href="#shop" class="bg-amber-400 text-slate-950 font-bold text-sm px-5 py-2.5 rounded-lg inline-block">Shop Now</a>
  </section>

  <!-- Products -->
  <main id="shop" class="max-w-4xl mx-auto p-4">
    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-950 text-slate-400 text-center text-xs p-5 mt-8">
    <p class="text-white font-semibold mb-1">AR Clothing</p>
    <p id="shop-info"></p>
  </footer>

  <script>
    // EDIT STORE DETAILS HERE
    const SHOP = {
      name: "AR Clothing",
      phone: "918248654092",
      info: "Main Market Road, Chennai | Call/WhatsApp: +91 82486 54092"
    };

    // MATCH THESE IMAGE FILENAMES TO THE PHOTOS YOU UPLOADED TO GITHUB
    const ITEMS = [
      { name: "Classic Formal Shirt", price: 799, sizes: "S, M, L, XL", img: "shirt1.jpg" },
      { name: "Cotton Casual Shirt", price: 699, sizes: "M, L, XL", img: "shirt2.jpg" },
      { name: "Crewneck Polo Tee", price: 499, sizes: "S, M, L, XL", img: "tshirt1.jpg" },
      { name: "Stretch Chino Trousers", price: 999, sizes: "30, 32, 34, 36", img: "pant1.jpg" }
    ];

    document.getElementById("wa-top").href = `https://wa.me{SHOP.phone}`;
    document.getElementById("shop-info").textContent = SHOP.info;

    document.getElementById("grid").innerHTML = ITEMS.map(item => {
      const msg = encodeURIComponent(`Hi ${SHOP.name}! I want to order: ${item.name} (₹${item.price}).`);
      return `
        <div class="bg-white rounded-xl border p-3 shadow-sm flex flex-col justify-between">
          <div>
            <img src="${item.img}" alt="${item.name}" class="w-full h-52 object-cover rounded-lg mb-3" />
            <h3 class="font-bold text-base">${item.name}</h3>
            <p class="text-xs text-slate-500">Sizes: ${item.sizes}</p>
            <p class="font-extrabold text-lg mt-1">₹${item.price}</p>
          </div>
          <a href="https://wa.me{SHOP.phone}?text=${msg}" target="_blank"
             class="mt-3 block text-center bg-emerald-600 text-white font-bold py-2 rounded-lg text-sm">
            Order on WhatsApp
          </a>
        </div>
      `;
    }).join("");
  </script>
</body>
</html>
